[package]
name = "partydeck"
version = "0.8.5"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
partydeck-comp-proto.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
dialog = "0.3.0"
eframe = { version = "0.32.1", features = ["x11", "wayland", "accesskit", "default_fonts", "glow"], default-features = false }
egui_extras = { version = "0.32.1", features = ["file", "image"], default-features = false }
evdev = "=0.13.0"
fastrand = "2.3.0"
# Not used directly: supplies the png/jpeg decoders behind egui_extras' image loader.
image = { version = "0.25.8", features = ["jpeg", "png"], default-features = false }
libc = "0.2"
pathsearch = "0.2.0"
reqwest = { version = "0.12.15", features = ["blocking", "json"] }
rfd = "0.15.3"
steamlocate = "2.0.1"
x11rb = { version = "0.13.1", default-features = false }
zip = { version = "5.1.1", features = ["deflate", "deflate64"], default-features = false }
