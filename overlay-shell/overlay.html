<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               font-family: system-ui, "DejaVu Sans", sans-serif; }
  .hud { position: fixed; top: 0; left: 0; right: 0; height: 54px;
         background: linear-gradient(180deg, rgba(10,14,22,.85), rgba(10,14,22,.55));
         display: flex; align-items: center; gap: 14px; padding: 0 22px;
         border-bottom: 1px solid rgba(77,140,242,.35); }
  .mark { color: #ecf1f7; font-weight: 800; letter-spacing: .12em; font-size: 19px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #37d67a;
         animation: pulse 1.6s ease-in-out infinite; }
  .players { margin-left: auto; display: flex; gap: 10px; }
  .chip { background: rgba(77,140,242,.16); border: 1px solid rgba(77,140,242,.5);
          color: #cfe0fb; padding: 4px 12px; border-radius: 999px; font-size: 13px; }
  .chip.live::before { content: "● "; color: #37d67a; }
  .card { position: fixed; right: 26px; bottom: 26px; width: 300px;
          background: rgba(13,18,27,.88); border: 1px solid rgba(77,140,242,.45);
          border-radius: 14px; padding: 18px 20px; color: #ecf1f7;
          box-shadow: 0 12px 34px rgba(0,0,0,.5);
          animation: slidein .7s cubic-bezier(.2,.9,.25,1.2); }
  .card h1 { margin: 0 0 6px; font-size: 15px; letter-spacing: .1em; }
  .card p { margin: 0; font-size: 13px; color: #94a3b8; }
  .bar { height: 4px; background: rgba(77,140,242,.2); border-radius: 2px; margin-top: 12px; }
  .bar i { display: block; height: 100%; width: 40%; background: #4d8cf2; border-radius: 2px;
           animation: scan 1.8s ease-in-out infinite; }
  @keyframes pulse   { 50% { opacity: .35; transform: scale(.8); } }
  @keyframes scan    { 0% { margin-left: 0 } 50% { margin-left: 60% } 100% { margin-left: 0 } }
  @keyframes slidein { from { transform: translateY(30px); opacity: 0 } }
</style>
</head>
<body>
  <div class="hud">
    <div class="dot"></div>
    <div class="mark">PARTYDECK</div>
    <div class="players">
      <div class="chip live">Blinky</div>
      <div class="chip live">Jak</div>
    </div>
  </div>
  <div class="card">
    <h1>HTML OVERLAY ONLINE</h1>
    <p>Rendered by CEF over the session — CSS animations live.</p>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
