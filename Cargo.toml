[workspace]
resolver = "3"
members = ["crates/partydeck", "crates/partydeck-comp", "crates/comp-proto"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jackhric/partydeck"

[workspace.dependencies]
partydeck-comp-proto = { path = "crates/comp-proto" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
