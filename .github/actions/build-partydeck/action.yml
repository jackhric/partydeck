name: Build PartyDeck
description: >
  Build the Holo release tarball and the AppImage inside the Holo toolchain
  container. Assumes the job already declared the holo-toolchain-rust container,
  checked out the repo with submodules, and placed the host-built overlay UI at
  overlay/ui/dist/overlay.html. Caches pacman, cargo and the CEF tarball.

inputs:
  version:
    description: Version string embedded in artifact filenames (e.g. v1.2.3 or UNOFFICIAL).
    required: true

outputs:
  tarball:
    description: Path to the produced release tarball.
    value: partydeck-${{ inputs.version }}-steamdeck-x86_64.tar.gz
  appimage:
    description: Path to the produced AppImage.
    value: partydeck-${{ inputs.version }}-anylinux-x86_64.AppImage

runs:
  using: composite
  steps:
    - name: Cache pacman packages
      uses: actions/cache@v4
      with:
        path: /var/cache/pacman/pkg
        key: pacman-holo-${{ hashFiles('packaging/holo-deps.txt') }}
        restore-keys: pacman-holo-

    # Same list as packaging/Dockerfile: edit packaging/holo-deps.txt, not this file.
    - name: Install build dependencies
      shell: bash
      run: |
        pacman-key --init
        sed -e 's/#.*//' packaging/holo-deps.txt | xargs pacman -Sy --noconfirm --needed
        pacman -S --noconfirm --overwrite '*' libpipewire
        # gamescope-kbm must not link the image's libdisplay-info.so.2 (the Deck
        # ships .so.3 only); without the package meson statically links its own.
        pacman -Rdd --noconfirm libdisplay-info || true
        install -m755 packaging/scripts/pacman_shim.sh /usr/local/bin/pacman  # see packaging/scripts/pacman_shim.sh for more info

    - name: Check overlay UI is present
      shell: bash
      run: |
        test -f overlay/ui/dist/overlay.html || {
            echo "overlay/ui/dist/overlay.html missing: run 'make -C overlay ui' on the host and download it into the job" >&2
            exit 1
        }

    # CARGO_HOME and CARGO_TARGET_DIR come from the calling job so rust-cache
    # and the build see the same locations.
    - name: Cache cargo + build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target

    # The Makefile re-verifies the sha256 and re-extracts on a miss, so caching
    # only the tarball (not the multi-GB extracted dist) is enough.
    - name: Cache CEF tarball
      uses: actions/cache@v4
      with:
        path: build/cef/cef.tar.bz2
        key: cef-${{ hashFiles('overlay/Makefile') }}

    - name: Resolve gamescope revision
      id: gamescope
      shell: bash
      run: echo "sha=$(git -C deps/gamescope rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache gamescope build
      uses: actions/cache@v4
      with:
        path: build/gamescope
        key: gamescope-${{ steps.gamescope.outputs.sha }}-${{ hashFiles('deps/deps.patch', 'packaging/scripts/build_gamescope.sh') }}

    - name: Build skeleton + AppImage
      shell: bash
      run: ./packaging/scripts/build_all.sh

    - name: Package tarball
      shell: bash
      run: |
        tar -czf "partydeck-${{ inputs.version }}-steamdeck-x86_64.tar.gz" \
            -C build/holo release/
        cp build/appimage/partydeck-anylinux-x86_64.AppImage \
            "partydeck-${{ inputs.version }}-anylinux-x86_64.AppImage"
