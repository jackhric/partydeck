name: CI

on:
  pull_request:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Formatting, lints and unit tests on a stock Ubuntu toolchain. The release
  # binaries are built against Holo in the build workflow below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              pkg-config libssl-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: TypeScript bindings are current
        run: |
          cargo test -p partydeck-comp-proto --features ts
          git diff --exit-code -- overlay/ui/src/generated

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: overlay/ui/pnpm-lock.yaml

      - name: overlay ui
        run: |
          pnpm -C overlay/ui install --frozen-lockfile
          pnpm -C overlay/ui run --if-present test
          pnpm -C overlay/ui build

  build:
    uses: ./.github/workflows/build.yml
    with:
      version: UNOFFICIAL
