name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  # SteamOS-targeted tarball: built on Holo so binaries link against the Deck's packages.
  build-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Holo image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            -t partydeck-holo \
            -f dist/Dockerfile.holo .

      - name: Build release skeleton
        run: docker run --rm -v "$PWD:/workspace" partydeck-holo

      - name: Create tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -czf "partydeck-${TAG}-steamos-x86_64.tar.gz" \
              -C dist/build/holo release/

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: partydeck-*-steamos-x86_64.tar.gz
          if-no-files-found: error

  # AppImage bundles its own libs via sharun, so it's OS-agnostic. Built
  # on Arch because Holo lacks the gcc-libs packaging.
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Arch image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            -t partydeck-arch \
            -f dist/Dockerfile .

      - name: Build AppImage
        run: docker run --rm -v "$PWD:/workspace" partydeck-arch

      - name: Stage AppImage with tag name
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp dist/appimage_generated/partydeck-anylinux-x86_64.AppImage \
             "partydeck-${TAG}-anylinux-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: partydeck-*-anylinux-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [build-tarball, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: |
            partydeck-*-linux-x86_64.tar.gz
            partydeck-*-anylinux-x86_64.AppImage

  build-holo:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/steamdeckhomebrew/holo-toolchain-rust:latest
    env:
      RUSTUP_HOME: /.rustup
      CARGO_HOME: /.cargo
    steps:
      - name: Install dependencies
        run: |
          export PATH="/.cargo/bin:$PATH"
          pacman-key --init || true
          # Mirror the Arch package list, with two holo-specific fixes:
          #   - wlroots0.18 dropped (gamescope fork vendors wlroots as a meson
          #     subproject via force_fallback_for=wlroots; not in holo repos).
          #   - pkg-config -> pkgconf (real package name; Provides: pkg-config).
          pacman -Sy --noconfirm --needed \
            git meson clang glslang libcap sdl2 vulkan-headers \
            libx11 libxmu libxcomposite libxrender libxres libxtst libxkbcommon \
            libdrm libinput wayland-protocols benchmark xorg-xwayland pipewire \
            lcms2 hwdata seatd xcb-util-wm xcb-util-errors \
            cmake libavif libheif aom rav1e libdecor libxdamage luajit libva \
            libxss wget curl xorg-server-xvfb fuse-overlayfs bubblewrap zsync \
            pulseaudio pipewire-audio alsa-plugins libxkbcommon-x11 libvdpau \
            libvdpau-va-gl sudo pkgconf openssl zip base-devel
          rustup default stable

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build partydeck
        run: |
          export PATH="/.cargo/bin:$PATH"
          cargo build --release -F build_gamescope -F download_deps

      - name: Assemble output
        run: |
          mkdir -p partydeck

          cp target/release/partydeck partydeck/partydeck

          cp -r target/release/res partydeck/res
          cp -r target/release/bin partydeck/bin

          cp res/GamingModeLauncher.sh partydeck/GamingModeLauncher.sh
          cp LICENSE partydeck/LICENSE
          cp COPYING.md partydeck/thirdparty.txt

      - name: Create tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -czf "partydeck-${TAG}-steamdeck-x86_64.tar.gz" partydeck/

      - name: Build appimage
        run: |
          export PATH="/.cargo/bin:$PATH"
          TAG="${GITHUB_REF_NAME}"
          ./dist/build_appimage.sh
          cp ./dist/appimage_generated/partydeck-anylinux-x86_64.AppImage partydeck-${TAG}-steamdeck-x86_64.AppImage

      - name: Upload holo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-holo
          path: |
            partydeck-*-steamdeck-x86_64.tar.gz
            partydeck-*-steamdeck-x86_64.AppImage

  release:
    needs: [build-arch, build-holo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            partydeck-*-steamos-x86_64.tar.gz
            partydeck-*-anylinux-x86_64.AppImage
          generate_release_notes: true
