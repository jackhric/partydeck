name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version string for artifact names (e.g. v1.2.3).
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.tarball_artifact }}

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.appimage_artifact }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            partydeck-${{ needs.version.outputs.value }}-steamdeck-x86_64.tar.gz
            partydeck-${{ needs.version.outputs.value }}-anylinux-x86_64.AppImage
